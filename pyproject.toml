[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hltv-demo-fetch"
version = "0.1.0"
description = "Download CS2 GOTV demos from HLTV with a Cloudflare-resistant transport"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "TAOMA-06" }]
keywords = ["cs2", "hltv", "demo", "gotv", "cloudflare", "scraper"]
dependencies = ["curl_cffi>=0.11"]

[project.optional-dependencies]
browser = ["playwright>=1.50"]
dev = ["playwright>=1.50"]

[project.scripts]
hltv-demo-fetch = "hltv_demo_fetch.cli:main"

[tool.setuptools.packages.find]
include = ["hltv_demo_fetch*"]
